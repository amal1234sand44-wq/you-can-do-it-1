

name: Build You Can Do It APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "Found: $ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          if [ -f extracted/settings.gradle.kts ]; then
            cp -r extracted/. .
          else
            ROOT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
            cp -r "$ROOT"/. .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouCanDoIt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
